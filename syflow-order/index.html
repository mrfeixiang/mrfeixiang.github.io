<title>SyFlow Order · Basket Optimizer</title>
<style>

argin:14px 0}.control label{display:flex;justify-content:space-between;color:#354a56;font-size:13px;font-weight:600;margin-bottom:6px}.control input{width:100%;border:1px solid #cdd9dd;border-radius:8px;background:#fbfdfd;padding:10px;color:#152b35;outline-color:#21a782}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cbdad9;border-radius:9px;background:white;padding:10px 13px;cursor:pointer;color:#254b48;font-weight:700;font-size:13px}.btn:hover{border-color:#169b79}.btn.primary{background:#15795f;color:white;border-color:#15795f}.btn.primary:hover{background:#0b654e}.btn:disabled{opacity:.5;cursor:not-allowed}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.note{background:#fff8e8;border:1px solid #f1e2be;padding:12px;border-radius:9px;color:#755d27;font-size:12px;line-height:1.5;margin-top:14px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.metric{border:1px solid #e4ecec;border-radius:12px;padding:15px;background:#fbfdfd}.metric.highlight{background:#ebf9f3;border-color:#badfce}.metric small{color:#688087;font-size:12px}.metric b{font-size:21px;display:block;margin-top:7px;white-space:nowrap}.metric span{display:block;font-size:11px;color:#628277;margin-top:4px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}.cost{border:1px solid #e1e9e8;border-radius:12px;padding:17px}.cost.good{border-color:#9ad5b6;background:#f7fdf9}.cost h3{font-size:14px;margin:0 0 13px}.cost dl{margin:0}.cost dl div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:#58717b;font-size:13px}.cost dl strong{color:#253740}.cost .total{border-top:1px solid #dfe8e6;margin-top:9px;padding-top:12px;font-size:16px;color:#17372f;font-weight:800}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title h2{margin:0}.table-wrap{overflow:auto;border:1px solid #e6eded;border-radius:10px}table{ </style></head><body>
<header><div class="brand"><div class="mark">S</div><div><strong>SyFlow Order</strong><span data-ko="COMPOUND PROCUREMENT · DEMO MVP" data-en="COMPOUND PROCUREMENT · DEMO MVP"></span></div></div><div class="lang"><button id="ko" class="active">한국어</button><button id="en">English</button></div></header>
<main><div class="intro"><div><div class="eyebrow">Design → Select → Order</div><h1 data-ko="화합물 구매, 전체 비용으로 결정하세요" data-en="Optimize the whole compound order"></h1><p data-ko="공급사별 고정비와 물류비를 함께 계산해 구매 바구니를 구성합니다." data-en="Optimize compound prices together with vendor and supplier-group fees."></p></div><span class="tag" data-ko="온라인 데모 · 샘플 견적" data-en="Online demo · sample quotes"></span></div>
<div class="context"><div><small data-ko="실제 문의 내용" data-en="From the actual inquiry"></small><b>71</b><small data-ko="화합물 품목" data-en="compound items"></small></div><div><small data-ko="실제 문의 내용" data-en="From the actual inquiry"></small><b>9</b><small data-ko="서로 다른 공급사" data-en="underlying suppliers"></small></div><div><small data-ko="실제 견적의 추산" data-en="Estimated in actual quote"></small><b>≈ ₩3.7M</b><small data-ko="해외 운송·포장·국내 배송" data-en="inbound, packaging and local delivery"></small></div></div>
<div class="grid"><aside><section class="panel"><h2 data-ko="1. 견적 가져오기" data-en="1. Import quotes"></h2><p data-ko="샘플로 시작하거나 동일한 열 형식의 CSV를 올리세요." data-en="Start with the sample or upload a CSV with the same columns."></p><div class="actions"><button class="btn" id="sample" data-ko="샘플 불러오기" data-en="Load sample"></button><label class="btn file"><span data-ko="견적 CSV 업로드" data-en="Upload quote CSV"></span><input type="file" id="upload" accept=".csv,text/csv"></label><a class="btn" href="./sample_quotes.csv" download data-ko="양식 다운로드" data-en="Download template"></a></div><div class="note" data-ko="샘플 12개 후보의 가격과 공급 조건은 모두 가상입니다. 상단의 71개·9개·약 ₩370만만 첨부된 실제 문의에서 가져왔습니다." data-en="All prices and availability for the 12 sample candidates are fictional. Only the 71 items, nine suppliers and ~₩3.7M context above came from the attached inquiry."></div></section>
<section class="panel"><h2 data-ko="2. 구매 조건" data-en="2. Purchase constraints"></h2><p data-ko="확인 완료된 동일 구조 견적만 최적화에 포함합니다." data-en="Only manually confirmed exact-structure quotes are eligible."></p><div class="control"><label for="purity"><span data-ko="최소 순도 (%)" data-en="Minimum purity (%)"></span></label><input id="purity" type="number" min="0" max="100" value="95"></div><div class="control"><label for="quantity"><span data-ko="최소 수량 (mg)" data-en="Minimum quantity (mg)"></span></label><input id="quantity" type="number" min="0.01" step="0.1" value="5"></div><div class="control"><label for="lead"><span data-ko="최대 리드타임 (일)" data-en="Maximum lead time (days)"></span></label><input id="lead" type="number" min="0" value="21"></div><div class="control"><label for="vendors"><span data-ko="최대 구매 채널 수" data-en="Maximum purchasing channels"></span></label><input id="vendors" type="number" min="1" max="100" value="3"></div><button class="btn primary" id="run" data-ko="전체 비용 최적화" data-en="Optimize total cost"></button><div class="status" id="status" role="status"></div></section>
<section class="panel"><h2 data-ko="비용 계산 방식" data-en="Cost model"></h2><p data-ko="화합물 합계 + 선택한 구매 채널의 고정비 + 선택한 출고 그룹의 고정비. 각 고정비는 바구니에서 한 번만 부과됩니다." data-en="Compound subtotal + one fixed fee per selected channel + one fixed fee per selected supplier group. Each fixed fee is charged once per basket."></p><div class="foot" data-ko="세금, 환율, 할인, 관세 및 실제 배송 확약은 포함되지 않습니다." data-en="Taxes, exchange rates, discounts, customs and confirmed delivery are outside this MVP."></div></section></aside>
<div><section class="panel"><div class="section-title"><h2 data-ko="구매 바구니 비교" data-en="Basket comparison"></h2><span class="pill" id="badge">DEMO</span></div><div id="results"><div class="empty"><b data-ko="샘플을 불러와 비교해 보세요" data-en="Load the sample to compare baskets"></b><span data-ko="가격이 가장 싼 견적을 각각 선택한 경우와 전체 바구니의 최소 비용을 비교합니다." data-en="Compare independent cheapest line items against the globally optimized basket."></span></div></div></section><section class="panel"><div class="section-title"><h2 data-ko="선택한 구매 목록" data-en="Selected order list"></h2><button class="btn" id="export" disabled data-ko="주문 CSV 내보내기" data-en="Export order CSV"></button></div><div id="order"><div class="empty" data-ko="최적화 후 공급처별 목록이 여기에 표시됩니다." data-en="Optimized vendor assignments will appear here."></div></div></section><section class="panel"><h2 data-ko="CSV 열 및 구조 확인" data-en="CSV columns and structure review"></h2><p data-ko="candidate_id, smiles, vendor, supplier_group, price_krw, vendor_fee_krw, group_fee_krw, quantity_mg, purity_pct, lead_days, match_status" data-en="candidate_id, smiles, vendor, supplier_group, price_krw, vendor_fee_krw, group_fee_krw, quantity_mg, purity_pct, lead_days, match_status"></p><div class="breakdown" data-ko="match_status: exact_confirmed / review / mismatch. 실제 견적에서는 구조, 입체화학, 염·용매화물, 용량을 확인한 뒤 exact_confirmed로 바꾸세요. 이 데모는 SMILES를 자동으로 표준화하거나 화학적 동일성을 검증하지 않습니다." data-en="match_status: exact_confirmed / review / mismatch. Set exact_confirmed only after checking structure, stereochemistry, salt or solvate, and pack size. This demo does not canonicalize SMILES or verify chemical equivalence."></div></section></div></div><p class="foot" style="text-align:center;margin:20px" data-ko="CSV 파일과 계산은 이 브라우저에서만 처리됩니다. 서버로 업로드되지 않습니다." data-en="Your CSV and calculations stay in this browser. Nothing is uploaded to a server."></p></main>

<script src="./optimizer.js"></script>
<script src="./app.js"></script>
</body></html>
